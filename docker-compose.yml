services:
  db:
    image: postgis/postgis:16-3.4
    container_name: barakagive_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7
    container_name: barakagive_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: barakagive_backend
    command: sh docker/entrypoint.sh
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ../barakagive-frontend
      dockerfile: Dockerfile
    container_name: barakagive_frontend
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../barakagive-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: barakagive_celery
    command: celery -A config worker -l info
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  ia_service:
    build:
      context: ../barakagive-ia-service
      dockerfile: Dockerfile
    container_name: barakagive_ia_service
    restart: always
    working_dir: /app
    volumes:
      - ../barakagive-ia-service:/app
    env_file:
      - ../barakagive-ia-service/.env
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  postgres_data: